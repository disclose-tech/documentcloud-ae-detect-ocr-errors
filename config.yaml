title: AE Detect OCR Errors
description: Add-On to detect OCR errors in AE documents
type: object
documents: []
properties:
  project:
    title: Project ID
    type: integer
  fix_errors:
    title: Fix errors
    description: Send the documents with errors to the Azure OCR Add-On for reprocessing.
    type: boolean
    default: false
  fix_max_pages:
    title: Fix only if document has less than X pages (0 for no limit)
    type: integer
    default: 50
  time_limit:
    title: Time limit
    type: integer
    default: 40
    description: Max minutes the add-on should run for.
  dry_run:
    title: Dry run
    description: If active, no document will be modified.
    type: boolean
    default: true
required:
  - project
categories: 
  - extraction
version: 2

eventOptions:
  events:
    - hourly
    - daily
    - weekly